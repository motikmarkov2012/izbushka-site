<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Избушка 3D</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; padding: 20px; text-align: center; background: #1e293b; border-bottom: 2px solid #38bdf8; }
        header h1 { color: #38bdf8; }
        .viewer-container { width: 90%; max-width: 800px; height: 500px; margin: 30px auto; background: #1e293b; border-radius: 16px; overflow: hidden; border: 1px solid #334155; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <header>
        <h1>CyberBabaYaga.Tech</h1>
        <p>Интерактивная 3D-избушка на курьих ножках</p>
    </header>

    <div class="viewer-container">
        <!-- Убедись, что файл izbushka.glb лежит рядом с index.html -->
        <model-viewer src="izbushka.glb" ar camera-controls auto-rotate shadow-intensity="1"></model-viewer>
    </div>

</body>
</html>
