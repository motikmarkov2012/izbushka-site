<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBabaYaga — 3D Избушка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; padding: 20px; text-align: center; background: #1e293b; border-bottom: 2px solid #22c55e; }
        header h1 { color: #22c55e; font-size: 26px; }
        header p { color: #94a3b8; font-size: 14px; margin-top: 5px; }
        .main-container { max-width: 800px; width: 90%; margin: 30px auto; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; text-align: center; }
        .placeholder { width: 100%; height: 350px; background: #0f172a; border-radius: 12px; border: 2px dashed #334155; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-top: 15px; }
        .icon { font-size: 60px; margin-bottom: 10px; }
        .btn { background: #22c55e; color: #0f172a; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .btn:hover { background: #16a34a; }
    </style>
</head>
<body>
    <header>
        <h1>🏚️ CyberBabaYaga.Tech</h1>
        <p>Лаборатория сказочной робототехники и 3D-моделирования</p>
    </header>
    <div class="main-container">
        <div class="card">
            <h2>🍗 Прототип #1: Избушка на курьих ножках</h2>
            <div class="placeholder">
                <div class="icon">🏚️</div>
                <p style="color: #94a3b8;">Интерфейс готов! Ожидается подключение 3D-модели.</p>
            </div>
            <button class="btn" onclick="alert('Сайт готов! Скоро загрузим модель.')">Проверить работу</button>
        </div>
    </div>
</body>
</html>
